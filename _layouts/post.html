---
layout: default
---
{%- assign slug = page.url | remove: '/' | remove: '.html' -%}
{%- assign pub = site.data.publications | where: 'post', slug | first -%}
<article class="post prose">
  <p class="eyebrow"><a href="{{ '/#publications' | relative_url }}">← Publications</a>{% if pub %} · {{ pub.year }}{% endif %}</p>
  <h1>{{ page.title }}</h1>
  {{ content }}
</article>
